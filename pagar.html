<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOX · Pagamento</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#E6E1D8;color:#1B1916;font:16px "Inter Tight",Helvetica,Arial,sans-serif;text-align:center;padding:24px}button{margin-top:18px;background:#1B1916;color:#F3F0EA;border:0;border-radius:999px;padding:14px 26px;font:inherit;cursor:pointer}</style></head>
<body><div><p style="font-size:13px;letter-spacing:.06em;text-transform:uppercase">VOX</p><p id="m">Abrindo o seu pedido no carrinho da VOX… Lá é só tocar em <b>Iniciar compra</b>.</p>
<form id="f" method="post" action="https://usevox.com.br/comprar/"><input type="hidden" name="add_to_cart" id="p"><input type="hidden" name="quantity" value="1"><button type="submit" id="b" hidden>Ir para o pagamento</button></form></div>
<script>
const q=new URLSearchParams(location.search),id=(q.get('p')||'').replace(/\D/g,'');
if(!id){document.getElementById('m').textContent='Link incompleto. Fale com a VOX pelo WhatsApp.'}
else{document.getElementById('p').value=id;document.getElementById('b').hidden=false;setTimeout(()=>document.getElementById('f').submit(),400)}
</script></body></html>
